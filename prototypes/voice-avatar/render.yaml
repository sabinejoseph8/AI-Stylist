# Approved one-session private notebook trial, 13 October 2026.
# Keep approval settings operator-supplied; no allowance is initialized by deployment.
services:
  - type: web
    name: ai-stylist-private-preview
    rootDir: prototypes/voice-avatar
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node src/private-notes-trial-main.ts --activate-private-notes-trial
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: PREVIEW_PASSWORD
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVUS_API_KEY
        sync: false
      - key: PRIVATE_NOTES_TRIAL_FINANCIAL_APPROVED
        sync: false
      - key: PRIVATE_NOTES_TRIAL_SECURITY_APPROVED
        sync: false
      - key: PRIVATE_NOTES_TRIAL_APPROVAL_ID
        sync: false
