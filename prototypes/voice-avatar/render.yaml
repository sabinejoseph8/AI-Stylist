# Approved connection-only replacement probe, 18 October 2026.
# Keep approval settings operator-supplied; no allowance is initialized by deployment.
services:
  - type: web
    name: ai-stylist-private-preview
    rootDir: prototypes/voice-avatar
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node src/cvi-connection-probe-main.ts --activate-connection-probe
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: PREVIEW_PASSWORD
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVUS_API_KEY
        sync: false
      - key: PRIVATE_NOTES_TRIAL_FINANCIAL_APPROVED
        sync: false
      - key: PRIVATE_NOTES_TRIAL_SECURITY_APPROVED
        sync: false
      - key: PRIVATE_NOTES_TRIAL_APPROVAL_ID
        sync: false
      - key: PRIVATE_NOTES_TRIAL_STORE
        sync: false
      - key: PREVIEW_ORIGIN
        value: https://ai-stylist-private-preview.onrender.com
      - key: CVI_PROBE_APPROVAL_ID
        sync: false
      - key: CVI_PROBE_CALLBACK_KEY
        sync: false
      - key: CVI_PROBE_PAL_ID
        sync: false
      - key: CVI_PROBE_REPLACEMENT_APPROVED
        sync: false
      - key: CVI_PROBE_PREFLIGHT_UTC
        value: '1970-01-01T00:00:00Z'
      - key: CVI_PROBE_FREE_MINUTES
        value: '0'
      - key: CVI_PROBE_FREE_NO_OVERAGE_VERIFIED
        value: 'false'
      - key: CVI_PROBE_NO_OTHER_ROOMS_VERIFIED
        value: 'false'
