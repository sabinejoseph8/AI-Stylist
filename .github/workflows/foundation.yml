name: Foundation checks
on:
  push:
    paths: ['apps/foundation/**', 'tools/operations/**', 'prototypes/voice-avatar/**', 'packages/style-contracts/**', 'packages/catalog-contracts/**', 'supabase/**', '.github/workflows/foundation.yml']
  pull_request:
    paths: ['apps/foundation/**', 'tools/operations/**', 'prototypes/voice-avatar/**', 'packages/style-contracts/**', 'packages/catalog-contracts/**', 'supabase/**', '.github/workflows/foundation.yml']
permissions:
  contents: read
jobs:
  operations-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/operations -p 'test_*.py' -v
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/foundation/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:phase-2
      - run: npm run typecheck
      - run: npm run build
  prototype-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/voice-avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: prototypes/voice-avatar/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:phase-1
      - run: npm run typecheck
      - run: npm run build

  data-protections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npm ci --prefix apps/foundation --ignore-scripts --no-audit --no-fund
      - run: docker pull postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      - run: python3 apps/foundation/scripts/check-data-protections.py
