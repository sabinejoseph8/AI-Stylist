name: Foundation checks
on:
  push:
    paths: ['apps/foundation/**', 'packages/style-contracts/**', '.github/workflows/foundation.yml']
  pull_request:
    paths: ['apps/foundation/**', 'packages/style-contracts/**', '.github/workflows/foundation.yml']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/foundation/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:phase-2
      - run: npm run typecheck
      - run: npm run build
  prototype-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/voice-avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: prototypes/voice-avatar/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:phase-1
      - run: npm run typecheck
      - run: npm run build
